services:
  redis:
    image: redis:8
    container_name: ticket-booking-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
    container_name: ticket-booking-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in root .env}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  client:
    build:
      context: ./client
    container_name: ticket-booking-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server

volumes:
  redis_data:
